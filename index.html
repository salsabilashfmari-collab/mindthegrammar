<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F5F7FA">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind the Grammar: IELTS grammar & vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#1E2B3C; --muted:#5A6878; --line:#DDE3EA;
  --pri:#2563C9; --pri-soft:#E6EEFB;
  --red:#D64545; --red-soft:#FCE9E9; --green:#1F8A5B; --green-soft:#E1F4EA; --gold:#C77A0A; --gold-soft:#FDF1DC; --blue:#127C86; --blue-soft:#E0F2F3;
  --grad:linear-gradient(150deg,#2563C9,#127C86); --ring:#BFD3F5;
  --sans:"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif:"Poppins", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121A26; --card:#1B2533; --ink:#E6ECF3; --muted:#9AA8B8; --line:#2C3A4C;
    --pri:#7FA8F5; --pri-soft:#1F2F4D; --grad:linear-gradient(150deg,#2D5FB8,#14707A); --ring:#34507E;
    --red:#F07A7A; --red-soft:#3A2024; --green:#5CCB97; --green-soft:#173527; --gold:#F2B85C; --gold-soft:#3A2C14; --blue:#5CC5CC; --blue-soft:#16363A;
  }
}
:root[data-theme="dark"]{
  --paper:#121A26; --card:#1B2533; --ink:#E6ECF3; --muted:#9AA8B8; --line:#2C3A4C;
    --pri:#7FA8F5; --pri-soft:#1F2F4D; --grad:linear-gradient(150deg,#2D5FB8,#14707A); --ring:#34507E;
    --red:#F07A7A; --red-soft:#3A2024; --green:#5CCB97; --green-soft:#173527; --gold:#F2B85C; --gold-soft:#3A2C14; --blue:#5CC5CC; --blue-soft:#16363A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
img{max-width:100%}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:1.35rem;line-height:1.05;letter-spacing:-.02em;margin:0 8px 22px}
.brand .gap{display:block;height:6px;margin-top:8px;background:linear-gradient(90deg,var(--pri) 0 42%,transparent 42% 58%,var(--pri) 58%)}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:8px;letter-spacing:0}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;text-align:left;font-weight:600;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--card);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--pri);color:#fff}
.side .foot{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--green)}

main{padding:36px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%}
h1,h2,h3{line-height:1.2;letter-spacing:-.025em;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
.lede{color:var(--muted);margin:8px 0 28px;max-width:60ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;line-height:1.2}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:999px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px;align-items:start}
.hello h1{font-size:clamp(2rem,4.6vw,3.1rem)}
.stats{display:flex;gap:26px;margin:22px 0 24px;flex-wrap:wrap}
.stat b{display:block;font-size:2rem;font-weight:700;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}
.goal{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.goal i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .4s}
.wotd{background:var(--grad);color:#fff;border:0}
.band{margin:0}
.band .num{font-size:2.8rem;font-weight:700;line-height:1;color:var(--pri)}
.band ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:.92rem}
.band li{margin:3px 0}
.wotd .w{font-family:var(--serif);font-size:2.1rem;line-height:1.1;margin:6px 0 8px}
.wotd p{margin:0 0 6px}
.wotd .ex{font-family:var(--serif);font-style:italic;opacity:.85}
.wotd .k{font-size:.85rem;opacity:.7}
.speak{border:0;background:none;padding:4px;border-radius:8px;vertical-align:middle;color:inherit;opacity:.8}
.speak:hover{opacity:1}
.speak svg{width:20px;height:20px}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--ink)}
.tile p{margin:0;color:var(--muted);font-size:.92rem}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px}
.tile .ic svg{width:22px;height:22px}

/* lessons */
.lessons{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 18px;border:1px solid var(--line);background:var(--card);border-radius:14px}
.lrow:hover{border-color:var(--ink)}
.lrow .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.lrow.done .n{background:var(--green-soft);color:var(--green)}
.lrow small{color:var(--muted)}
.read{font-family:var(--serif);font-size:1rem;line-height:1.75;max-width:66ch}
.read p{margin:0 0 14px}
.read .ex{border-left:4px solid var(--blue);padding:4px 0 4px 18px;margin:18px 0}
.read .ex p{margin:6px 0}
.read .ex span{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin-left:8px}
.read u{text-decoration:none;background:var(--blue-soft);padding:0 3px;border-radius:4px}
.read s{color:var(--red);text-decoration-thickness:2px;margin-right:6px}
.read .uk,.read .tip,.read .mis{border-radius:12px;padding:14px 18px;margin:16px 0}
.read .uk{background:var(--pri-soft)}
.read .tip{background:var(--gold-soft)}
.read .mis{background:var(--paper);border:1px dashed var(--line)}
.read .uk b,.read .tip b,.read .mis b{font-family:var(--sans);display:block;margin-bottom:4px}
.read .uk p,.read .tip p,.read .mis p{margin:0}
.back{border:0;background:none;padding:0;color:var(--muted);font-weight:600;margin-bottom:16px}
.back:hover{color:var(--ink)}

/* question engine */
.qbox{max-width:680px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.timer{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.qtext{font-family:var(--serif);font-size:1.3rem;line-height:1.45;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.gapin{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05rem}
.gapin:focus{border-color:var(--ink);outline:none}
.gapin.ok{border-color:var(--green);background:var(--green-soft)}
.gapin.no{border-color:var(--red);background:var(--red-soft)}
.toks{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--serif);font-size:1.25rem}
.tok{padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.tok:hover:not(:disabled){border-color:var(--ink)}
.tok.ok{border-color:var(--green);background:var(--green-soft)}
.tok.no{border-color:var(--red);background:var(--red-soft)}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-soft)}
.fb.no{background:var(--red-soft)}
.fb b{display:block}
.fb p{margin:4px 0 0}
.result{text-align:center;padding:30px 20px}
.result .big{font-size:4rem;font-weight:700;line-height:1}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:600;background:var(--blue-soft);color:var(--blue)}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.r{background:var(--red-soft);color:var(--red)}
.chip.y{background:var(--gold-soft);color:var(--gold)}

/* games */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.duel button{padding:30px 14px;font-family:var(--serif);font-size:1.4rem;border:2px solid var(--line);background:var(--card);border-radius:16px}
.duel button:hover{border-color:var(--ink)}
.duel button.ok{border-color:var(--green);background:var(--green-soft)}
.duel button.no{border-color:var(--red);background:var(--red-soft)}
.build{min-height:64px;padding:12px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-family:var(--serif);font-size:1.15rem}
.build.ok{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.build.no{border-style:solid;border-color:var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--serif);font-size:1.15rem;margin-bottom:16px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mc{padding:12px;border:2px solid var(--line);background:var(--card);border-radius:12px;text-align:left;font-size:.95rem}
.mc.sel{border-color:var(--blue);background:var(--blue-soft)}
.mc.gone{visibility:hidden}
.mc.no{border-color:var(--red)}
.mc.w{font-family:var(--serif);font-size:1.05rem;font-weight:600}

/* vocab */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--pri);border-bottom-color:var(--pri)}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.form input,.form textarea,.form select,.search{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);width:100%}
.form textarea{min-height:64px;resize:vertical}
.vlist{display:grid;gap:8px;margin-top:14px}
.vitem{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;align-items:start}
.vitem .w{font-family:var(--serif);font-weight:600;font-size:1.15rem}
.vitem .m{color:var(--ink)}
.vitem .x{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.95rem}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.lvl i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.lvl i.f{background:var(--green)}
.icon{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted)}
.icon:hover{color:var(--red);background:var(--paper)}
.icon svg{width:18px;height:18px}
.card3d{perspective:1200px;max-width:520px;margin:0 auto}
.flip{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--card)}
.face.b{transform:rotateY(180deg);background:var(--grad);color:#fff;border:0}
.face .w{font-family:var(--serif);font-size:2.3rem;line-height:1.15}
.face .m{font-size:1.25rem;font-weight:600;margin-bottom:10px}
.face .x{font-family:var(--serif);font-style:italic;opacity:.85}
.face small{position:absolute;bottom:16px;color:var(--muted);font-size:.8rem}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:16px auto 0}
.rate button{padding:12px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;line-height:1.2}
.rate button small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.rate .r1{border-color:var(--red)}.rate .r4{border-color:var(--green)}
.deck{display:flex;flex-direction:column;gap:10px}
.deck ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.deck li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem;padding:4px 0;border-bottom:1px solid var(--line)}
.deck li span{font-family:var(--serif)}
.ipa{font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS","Noto Sans",Roboto,"Helvetica Neue",sans-serif;font-style:normal;letter-spacing:.01em}
.read .ipa{font-family:"Segoe UI","Lucida Sans Unicode","Noto Sans",Roboto,sans-serif;background:var(--blue-soft);padding:0 4px;border-radius:4px;white-space:nowrap}
.read .ex span.ipa{font-size:inherit;color:inherit;margin-left:0}
.camb{font-size:.82rem;font-weight:600;color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.plancard{flex-direction:row!important;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px;width:100%}
.plancard .cd{font-size:2.6rem;font-weight:700;line-height:1;color:var(--pri);min-width:64px}
.tasks{display:grid;gap:8px;margin-top:14px}
.task{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.task label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;flex:1}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.task b{display:block;font-weight:600}
.task b small{font-weight:400;color:var(--muted);margin-left:6px}
.task label>span>span{display:block;font-size:.9rem;color:var(--muted)}
.task.done{background:var(--green-soft);border-color:transparent}
.task.done b{text-decoration:line-through;text-decoration-color:var(--green)}
.tgt{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tgt li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tgt li span{color:var(--pri);font-weight:600;text-align:right}
.scores{display:flex;flex-wrap:wrap;gap:6px}
.sc{display:grid;place-items:center;min-width:52px;padding:6px 8px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:.85rem}
.sc b{font-size:.7rem;color:var(--muted);font-weight:600}
.sc.g{background:var(--green-soft);border-color:transparent}.sc.y{background:var(--gold-soft);border-color:transparent}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.phase{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.phase.on{border:2px solid var(--pri);background:var(--pri-soft)}
.phase b{display:block}.phase small{color:var(--muted)}.phase p{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.weeks{display:grid;gap:8px}
.wk{border:1px solid var(--line);border-radius:14px;background:var(--card)}
.wk.on{border-color:var(--pri)}
.wk summary{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none}
.wk summary::-webkit-details-marker{display:none}
.wk summary .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--pri-soft);color:var(--pri)}
.wk summary b{display:block}.wk summary small{color:var(--muted)}
.wkb{padding:0 16px 14px 68px;font-size:.92rem}.wkb p{margin:4px 0}
.aiout{margin-top:14px;line-height:1.7;font-size:.95rem}
.aiout:not(:empty){padding:14px 16px;border-radius:12px;background:var(--pri-soft)}
@media (max-width:820px){.wkb{padding-left:16px}}
.memo-box{background:var(--gold-soft);border-radius:12px;padding:14px 18px;margin:18px 0;font-family:var(--sans)}
.memo-box b{display:block;margin-bottom:4px}.memo-box p{margin:0}
.read [data-say] svg{width:16px;height:16px}
.en-e{margin-top:6px!important;font-style:italic;opacity:.85}
.memo{margin-top:10px!important;padding-top:10px;border-top:1px dashed rgba(0,0,0,.15);font-size:.92rem}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.pill-xp{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:var(--gold);color:#fff;font-weight:700;padding:6px 12px;border-radius:20px;opacity:0;transition:.3s;z-index:40}
.pill-xp.show{opacity:1}

.me{display:flex;align-items:center;gap:12px;margin:-6px 8px 22px}
.me b{display:block;font-weight:600;line-height:1.2}
.me small{display:block;font-size:.78rem;color:var(--muted)}
.av{position:relative;flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--grad);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ring)}
.av span{color:#fff;font-weight:700;font-size:1.45rem;line-height:1;letter-spacing:-.02em}
.av i{position:absolute;right:-4px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:.72rem;box-shadow:0 0 0 1.5px var(--ring)}
.av.sm{width:34px;height:34px;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ring)}
.av.sm span{font-size:1rem}
.av.sm i{width:16px;height:16px;font-size:.55rem;right:-4px;bottom:-3px}
.credit{margin-top:8px;font-weight:600;color:var(--pri)}
.mcredit{display:none;text-align:center;color:var(--pri);font-weight:600;font-size:.9rem;margin:40px 0 0}
.mtop{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--card);z-index:30;justify-content:space-around;gap:0}
  .brand,.side .foot{display:none}

<script>
const LESSONS = [
{id:'pp', title:'Present perfect vs past simple', use:'Speaking & Writing Task 1', mins:6,
body:`<p>Bedanya sederhana. <b>Past simple</b> dipakai untuk kejadian yang sudah selesai di waktu yang jelas (yesterday, in 2019, last week). <b>Present perfect</b> (have/has + V3) dipakai untuk pengalaman, atau hasil yang masih nyambung ke sekarang, tanpa menyebut waktu spesifik.</p>
<div class="ex"><p>I <u>visited</u> London in 2022. <span>waktu jelas, past simple</span></p><p>I <u>have visited</u> London twice. <span>pengalaman, tanpa waktu</span></p><p>The population <u>has grown</u> steadily since 2000. <span>since/for, present perfect</span></p></div>
<div class="uk"><b>Catatan British</b><p>British English memakai present perfect dengan <i>just, already, yet</i>: “I’ve just finished.” “Have you eaten yet?” American English sering memakai past simple (“I just finished”). Untuk gaya UK, tetap pakai present perfect.</p></div>
<div class="tip"><b>Tips IELTS</b><p>Speaking Part 1 sering bertanya “How long have you lived in your hometown?” Jawab: “I’ve lived there since I was born” atau “for about twenty years.” Di Writing Task 1, data tahun lampau pakai past simple: “In 1990, car ownership stood at 40%.”</p></div>
<div class="mis"><b>Kesalahan umum</b><p><s>I have seen him yesterday.</s> I saw him yesterday.</p></div>`,
qs:[
{t:'mcq',q:'I ___ to Bali three times, but I’ve never been to Lombok.',o:['went','have been','was going','had gone'],a:1,e:'Pengalaman tanpa waktu spesifik → present perfect.'},
{t:'mcq',q:'She ___ her degree in 2021.',o:['has finished','finished','has been finishing','finishes'],a:1,e:'“in 2021” adalah waktu yang jelas → past simple.'},
{t:'gap',q:'We ___ (just / finish) the project, so we can relax now.',a:['have just finished',"we've just finished","'ve just finished"],e:'British English: just + present perfect.'},
{t:'err',q:['I','have met','my','best','friend','when','I','was','ten.'],a:1,fix:'met',e:'“when I was ten” = waktu lampau yang jelas, jadi pakai past simple “met”.'},
{t:'mcq',q:'Which sounds more natural in British English?',o:['Did you finish your essay yet?','Have you finished your essay yet?'],a:1,e:'“yet” di British English berpasangan dengan present perfect.'},
{t:'gap',q:'Unemployment ___ (rise) significantly since 2015.',a:['has risen','has been rising'],e:'“since” + present perfect. Rise → rose → risen.'},
{t:'mcq',q:'In 1990, car ownership ___ at 40%.',o:['has stood','stood','has been standing','stands'],a:1,e:'Data tahun lampau di Task 1 → past simple.'}
]},
{id:'art', title:'Articles: a, an, the, atau tanpa artikel', use:'Semua bagian', mins:7,
body:`<p>Bahasa Indonesia tidak punya artikel, jadi ini sumber error nomor satu. Pegang satu aturan dulu: <b>kata benda tunggal yang bisa dihitung tidak boleh berdiri sendiri</b>. Harus ada a/an, the, my, this, dan sejenisnya.</p>
<div class="ex"><p><u>A/an</u>: pertama kali disebut, atau pekerjaan. She is <u>a</u> doctor.</p><p><u>The</u>: sudah jelas yang mana, satu-satunya, superlatif. <u>The</u> government, <u>the</u> internet, <u>the</u> most important factor.</p><p><u>The + adjective</u> untuk kelompok orang: <u>the</u> elderly, <u>the</u> unemployed.</p><p><u>Tanpa artikel</u>: makna umum, jamak atau uncountable. Pollution is a serious problem. Children need education.</p></div>
<div class="uk"><b>Catatan British</b><p>Orang Inggris bilang “in hospital”, “at university”, “go to university” tanpa “the”. American: “in the hospital”.</p></div>
<div class="tip"><b>Tips IELTS</b><p>Sebelum submit Writing, cek setiap kata benda tunggal. Kalau berdiri sendiri, kemungkinan besar perlu artikel.</p></div>`,
qs:[
{t:'mcq',q:'___ unemployment is a major issue in many developing countries.',o:['The','A','(no article)','An'],a:2,e:'Makna umum + uncountable → tanpa artikel.'},
{t:'mcq',q:'My grandmother has been ___ hospital since Monday.',o:['in the','in','at the','on'],a:1,e:'British: “in hospital”.'},
{t:'gap',q:'___ elderly often feel isolated in big cities.',a:['the'],e:'The + adjective = kelompok orang.'},
{t:'err',q:['Government','should','invest','more','in','public','transport.'],a:0,fix:'The government',e:'“government” tunggal countable dan spesifik → the government.'},
{t:'mcq',q:'This is ___ most effective solution to the problem.',o:['a','the','an','(no article)'],a:1,e:'Superlatif selalu pakai “the”.'},
{t:'mcq',q:'She wants to study ___ medicine at ___ university in Edinburgh.',o:['the / a','(no article) / a','a / the','the / the'],a:1,e:'Nama bidang studi tanpa artikel; universitas yang belum spesifik → a.'}
]},
{id:'sva', title:'Subject–verb agreement & countable nouns', use:'Writing Task 1 & 2', mins:6,
body:`<p>Subjek tunggal pakai kata kerja tunggal. Masalahnya, subjek di IELTS sering panjang, jadi cari <b>inti</b> subjeknya.</p>
<div class="ex"><p><u>The number</u> of students <u>has</u> increased. <span>inti: the number</span></p><p><u>A number</u> of students <u>have</u> complained. <span>a number of = many</span></p><p><u>Each</u> / <u>every</u> / <u>everyone</u> + kata kerja tunggal.</p></div>
<p>Kata yang <b>uncountable</b> (tidak pakai -s, tidak pakai a/an): information, advice, research, equipment, furniture, evidence, knowledge, traffic, news, homework. Pakai <i>much, little, a lot of, a piece of</i>.</p>
<div class="uk"><b>Catatan British</b><p>Collective noun (government, team, family, staff, public) boleh pakai kata kerja jamak di British English: “The team are playing well.” Dua-duanya benar di UK. Di Writing, yang penting konsisten.</p></div>`,
qs:[
{t:'mcq',q:'The number of tourists ___ doubled over the decade.',o:['have','has','are','were'],a:1,e:'Inti subjek: “the number” (tunggal).'},
{t:'mcq',q:'There ___ a lot of evidence to support this view.',o:['are','is','have','were'],a:1,e:'“evidence” uncountable → is.'},
{t:'err',q:['Teachers','gave','us','some','useful','advices.'],a:5,fix:'advice',e:'“advice” uncountable, tidak pakai -s.'},
{t:'gap',q:'Every student ___ (need) access to the internet.',a:['needs'],e:'Every + kata kerja tunggal.'},
{t:'mcq',q:'Which is correct?',o:['The researches show...','Research shows...','A research shows...','Researches shows...'],a:1,e:'“research” uncountable.'},
{t:'mcq',q:'In British English, which is acceptable?',o:['“The team is” and “The team are” are both fine','Only “The team are”','Only “The team is”','Neither'],a:0,e:'Collective noun di UK bisa tunggal atau jamak.'}
]},
{id:'cond', title:'Conditionals', use:'Speaking Part 3 & Task 2', mins:8,
body:`<div class="ex"><p><u>Zero</u>: If + present, present. If you heat ice, it melts.</p><p><u>First</u>: If + present, will. If prices rise, people will buy less.</p><p><u>Second</u>: If + past, would. If I were the mayor, I would build more parks.</p><p><u>Third</u>: If + had V3, would have V3. If I had studied harder, I would have passed.</p><p><u>Mixed</u>: If I had taken that job (dulu), I would be living in London now (sekarang).</p></div>
<p>Untuk band 8 ke atas, variasikan: <i>unless, provided that, as long as</i>, dan inversion: “<b>Should</b> the government act now, ...”, “<b>Had</b> I known, ...”, “<b>Were</b> taxes lower, ...”.</p>
<div class="tip"><b>Tips IELTS</b><p>Speaking Part 3 sering meminta pendapat hipotetis. Second conditional terdengar natural: “If I were in charge, I would invest in public transport.” Pakai “were”, bukan “was”, untuk gaya formal.</p></div>
<div class="mis"><b>Kesalahan umum</b><p><s>If I will have time, I’ll call you.</s> If I have time, I’ll call you.</p></div>`,
qs:[
{t:'mcq',q:'If governments ___ more in renewable energy, pollution would fall.',o:['invest','invested','will invest','had invested'],a:1,e:'Second conditional: if + past, would.'},
{t:'mcq',q:'If I ___ about the traffic, I would have left earlier.',o:['knew','had known','have known','would know'],a:1,e:'Third conditional: if + had V3.'},
{t:'gap',q:'If water reaches 100°C, it ___ (boil).',a:['boils'],e:'Zero conditional untuk fakta.'},
{t:'err',q:['If','I','will','have','time,','I’ll','call','you.'],a:2,fix:'If I have time',e:'Klausa “if” tidak memakai “will”.'},
{t:'mcq',q:'___ the government act now, the crisis could be avoided.',o:['Should','Would','If','Unless'],a:0,e:'Inversion: Should + subject = If + subject + should.'},
{t:'mcq',q:'If she had taken the job in London, she ___ there now.',o:['will live','would have lived','would be living','had lived'],a:2,e:'Mixed conditional: masa lalu memengaruhi sekarang.'}
]},
{id:'pass', title:'Passive voice untuk diagram proses', use:'Writing Task 1', mins:7,
body:`<p>Rumusnya <b>be + V3</b>. Dipakai saat pelakunya tidak penting, tidak diketahui, atau untuk nada formal. Diagram proses di Task 1 hampir seluruhnya passive.</p>
<div class="ex"><p>is made / was made / has been made / is being made / will be made / can be made</p><p>First, the beans <u>are harvested</u>. They <u>are then dried</u> in the sun. Once they <u>have been roasted</u>, they <u>are packaged</u>.</p></div>
<p>Variasikan urutan: <i>First, Subsequently, After that, Once..., Finally</i>.</p>
<div class="mis"><b>Kesalahan umum</b><p>Kata kerja intransitif tidak bisa passive. <s>The accident was happened.</s> The accident happened. <s>Prices were risen.</s> Prices rose.</p></div>`,
qs:[
{t:'mcq',q:'Once the leaves ___, they are dried in the sun.',o:['pick','are picked','are picking','picked'],a:1,e:'Daunnya dipetik (oleh orang) → passive.'},
{t:'gap',q:'A new bridge ___ (build) at the moment.',a:['is being built'],e:'Present continuous passive: is being + V3.'},
{t:'err',q:['The','accident','was happened','at','night.'],a:2,fix:'happened',e:'“happen” intransitif, tidak bisa passive.'},
{t:'mcq',q:'Thousands of homes ___ by the flood last year.',o:['destroyed','were destroyed','have destroyed','are destroyed'],a:1,e:'Past simple passive.'},
{t:'mcq',q:'Which verb can’t be used in the passive?',o:['build','produce','arrive','collect'],a:2,e:'“arrive” intransitif.'},
{t:'gap',q:'The finished product ___ (then / package) and sent to shops.',a:['is then packaged','is then packed'],e:'Present simple passive, adverb “then” setelah “is”.'}
]},
{id:'rel', title:'Relative clauses', use:'Grammatical range', mins:6,
body:`<p><b>who</b> untuk orang, <b>which</b> untuk benda, <b>that</b> untuk defining clause, <b>whose</b> untuk kepemilikan, <b>where</b> untuk tempat, <b>when</b> untuk waktu.</p>
<div class="ex"><p><u>Defining</u> (tanpa koma, info penting): Students <u>who live on campus</u> save money.</p><p><u>Non-defining</u> (pakai koma, info tambahan, tidak boleh “that”): London, <u>which is the capital</u>, is expensive.</p><p><u>Reduced</u>: Students <u>living</u> on campus... The money <u>spent</u> on defence...</p></div>
<div class="tip"><b>Tips IELTS</b><p>Untuk band 8.5, examiner mencari variasi struktur yang dipakai secara natural dan hampir tanpa error. Satu atau dua relative clause per paragraf sudah cukup.</p></div>`,
qs:[
{t:'mcq',q:'London, ___ is the capital of the UK, attracts millions of tourists.',o:['that','which','who','where'],a:1,e:'Non-defining clause tidak boleh “that”.'},
{t:'mcq',q:'This is the town ___ I grew up.',o:['which','where','that','whose'],a:1,e:'Tempat → where.'},
{t:'gap',q:'People ___ cars are electric can save on fuel.',a:['whose'],e:'Kepemilikan → whose.'},
{t:'err',q:['My','sister,','that','lives','in','Leeds,','is','a','nurse.'],a:2,fix:'who',e:'Non-defining + orang → who.'},
{t:'mcq',q:'Reduce: “The money which is spent on defence” →',o:['The money spending on defence','The money spent on defence','The money which spent on defence','The money is spent on defence'],a:1,e:'Passive → V3 saja.'},
{t:'mcq',q:'Which is punctuated correctly?',o:['My father who is 60 still works.','My father, who is 60, still works.','My father, who is 60 still works.','My father who is 60, still works.'],a:1,e:'Ayah cuma satu, jadi infonya tambahan → dua koma.'}
]},
{id:'cmp', title:'Membandingkan data', use:'Writing Task 1', mins:7,
body:`<div class="ex"><p>Comparative: higher, more expensive. Superlative: the highest, the most popular.</p><p>Gradasi: <u>slightly / considerably / significantly / much</u> higher.</p><p>Kelipatan: <u>twice as many</u> people <u>as</u>..., <u>three times higher than</u>...</p><p><u>The number of</u> + countable (cars, people). <u>The amount of</u> + uncountable (water, money).</p><p>Kontras: Japan rose, <u>whereas</u> Korea fell.</p></div>
<div class="uk"><b>Catatan British</b><p>Tulisan British memakai “per cent” (dua kata). “Percentage” adalah kata benda: “the percentage of students”.</p></div>
<div class="mis"><b>Kesalahan umum</b><p><s>more higher</s> higher. <s>the number of water</s> the amount of water.</p></div>`,
qs:[
{t:'mcq',q:'The ___ of water consumed rose sharply.',o:['number','amount','many','few'],a:1,e:'water uncountable → amount.'},
{t:'mcq',q:'Sales in 2020 were ___ those in 2010.',o:['twice as high as','twice higher as','two times as higher than','double than'],a:0,e:'Pola: twice as + adj + as.'},
{t:'err',q:['Japan','had','a','more','higher','rate','than','Korea.'],a:3,fix:'(hapus “more”)',e:'“higher” sudah comparative.'},
{t:'gap',q:'Spain recorded the ___ (low) figure of all five countries.',a:['lowest'],e:'Superlatif dari low.'},
{t:'mcq',q:'In British English, “15%” in words is usually:',o:['15 percents','15 per cent','15 percentage','15 per cents'],a:1,e:'“per cent”, tanpa -s.'},
{t:'mcq',q:'Choose the correct sentence:',o:['The price was very more expensive.','The price was considerably more expensive.','The price was more expensiver.','The price was much expensive.'],a:1,e:'considerably + comparative.'}
]},
{id:'link', title:'Linking words & cohesion', use:'Coherence and Cohesion', mins:7,
body:`<div class="ex"><p><u>Kontras</u>: however (awal kalimat + koma), although / even though + klausa, despite / in spite of + noun atau -ing, whereas / while.</p><p><u>Tambahan</u>: moreover, furthermore, in addition, what is more.</p><p><u>Sebab-akibat</u>: therefore, consequently, as a result, due to + noun.</p><p><u>Contoh</u>: for instance, such as.</p></div>
<div class="tip"><b>Tips IELTS</b><p>Examiner menurunkan nilai linker yang dipakai mekanis di setiap kalimat. “On the other hand” hanya untuk sisi yang berlawanan, bukan untuk menambah poin.</p></div>
<div class="mis"><b>Kesalahan umum</b><p><s>Although it was expensive, but many bought it.</s> Pilih salah satu: although atau but. <s>Despite of</s> Despite.</p></div>`,
qs:[
{t:'mcq',q:'___ the heavy rain, the match went ahead.',o:['Although','Despite','However','Even though'],a:1,e:'Diikuti noun → despite.'},
{t:'mcq',q:'Public transport is cheap. ___, it is often unreliable.',o:['Although','Despite','However','Whereas'],a:2,e:'Awal kalimat baru + koma → however.'},
{t:'err',q:['Although','it','was','expensive,','but','many','people','bought','it.'],a:4,fix:'(hapus “but”)',e:'Although dan but tidak dipakai bersamaan.'},
{t:'gap',q:'The factory closed. As a ___, hundreds lost their jobs.',a:['result'],e:'As a result = akibatnya.'},
{t:'mcq',q:'Which is correct?',o:['Despite of the cost, ...','In spite the cost, ...','Despite the cost, ...','Despite the cost is high, ...'],a:2,e:'Despite + noun, tanpa “of”.'},
{t:'mcq',q:'Cities offer more jobs, ___ rural areas offer a slower pace of life.',o:['whereas','therefore','moreover','for example'],a:0,e:'Membandingkan dua hal yang berlawanan → whereas.'}
]},
{id:'mod', title:'Modals & hedging', use:'Task 2 & Speaking', mins:6,
body:`<p><b>Hedging</b> membuat tulisan terdengar akademis dan tidak terlalu absolut: <i>may, might, could, tend to, it is likely that, arguably, to some extent, it could be argued that</i>.</p>
<div class="ex"><p><s>Social media destroys friendships.</s> Social media <u>may weaken</u> some friendships.</p><p>Deduksi masa lalu: He <u>must have left</u>. She <u>can’t have seen</u> it. They <u>might have forgotten</u>.</p><p>Rekomendasi Task 2: Governments <u>should</u> ...</p></div>
<div class="uk"><b>Catatan British</b><p>“Have you got a car?” lebih British daripada “Do you have a car?”. “Shall I open the window?” untuk menawarkan. “You needn’t come” = tidak perlu.</p></div>`,
qs:[
{t:'mcq',q:'Which is the best academic hedge?',o:['Social media destroys all friendships.','Social media may weaken some friendships.','Social media totally kills friendship.','Social media is always bad.'],a:1,e:'may + some = tidak absolut.'},
{t:'gap',q:'He’s not answering. He ___ (must / leave) already.',a:['must have left'],e:'Deduksi masa lalu: must have + V3.'},
{t:'mcq',q:'The typical British way to ask about possession:',o:['Do you have got a pen?','Have you got a pen?','Have you a got pen?','Got you a pen?'],a:1,e:'“Have you got...?” khas British.'},
{t:'err',q:['You','should','to','apply','for','the','course','early.'],a:2,fix:'(hapus “to”)',e:'Modal + bare infinitive.'},
{t:'mcq',q:'You ___ bring food; lunch is provided.',o:['mustn’t','needn’t','can’t','shouldn’t to'],a:1,e:'needn’t = tidak perlu. mustn’t = dilarang.'},
{t:'mcq',q:'Strongest recommendation for a Task 2 conclusion:',o:['Governments might perhaps consider...','Governments should take immediate action to...','Governments can maybe...','Governments must to...'],a:1,e:'should + action = rekomendasi jelas.'}
]},
{id:'cx', title:'Kalimat kompleks band 8+', use:'Grammatical range', mins:8,
body:`<div class="ex"><p><u>Participle clause</u>: Having finished the report, she went home.</p><p><u>Noun clause</u>: What concerns me most is the cost.</p><p><u>Cleft sentence</u>: It is the cost that worries people.</p><p><u>Inversion</u>: Not only does it save money, but it also reduces waste. Rarely have we seen such growth.</p><p><u>The more..., the more...</u>: The more you read, the better you write.</p></div>
<div class="tip"><b>Tips IELTS</b><p>Di band 8.5, kalimat kompleks harus akurat dan terdengar alami. Satu struktur yang benar lebih bernilai daripada tiga yang salah.</p></div>
<div class="mis"><b>Kesalahan umum</b><p>Dangling participle: <s>Walking to work, the rain started.</s> Walking to work, I got caught in the rain.</p></div>`,
qs:[
{t:'mcq',q:'Not only ___ pollution, but it also saves money.',o:['it reduces','does it reduce','reduces it','it does reduce'],a:1,e:'Not only + auxiliary + subject.'},
{t:'mcq',q:'___ the report, she sent it to her manager.',o:['Having finished','Finished','Have finished','To finishing'],a:0,e:'Perfect participle: kejadian pertama selesai dulu.'},
{t:'gap',q:'The more you practise, the ___ (good) you become.',a:['better'],e:'The + comparative, the + comparative.'},
{t:'err',q:['Rarely','we have','seen','such','rapid','growth.'],a:1,fix:'Rarely have we seen',e:'Setelah “Rarely” di awal, urutannya dibalik.'},
{t:'mcq',q:'Which is a correct cleft sentence?',o:['It is the cost what worries people.','It is the cost that worries people.','Is the cost that worries people.','The cost it is worries people.'],a:1,e:'It is + X + that...'},
{t:'mcq',q:'Walking to work, ___.',o:['the rain started','I got caught in the rain','it was raining','the umbrella broke'],a:1,e:'Yang berjalan harus subjek kalimatnya (I).'}
]},
{id:'uk', title:'British English yang perlu kamu tahu', use:'Konsistensi gaya', mins:6,
body:`<div class="ex"><p>at the weekend <span>US: on the weekend</span></p><p>in hospital, at university</p><p>different from / different to <span>US: different than</span></p><p>fill in a form <span>US: fill out</span></p><p>Monday to Friday <span>US: through</span></p><p>flat, lift, queue, rubbish, holiday, mobile, motorway, petrol, timetable, autumn</p></div>
<p><b>Ejaan:</b> colour, centre, travelled, programme, defence, grey, tyre, jewellery. <i>Practice</i> (noun) dan <i>practise</i> (verb); <i>licence</i> (noun) dan <i>license</i> (verb).</p>
<div class="uk"><b>Catatan British</b><p>Akhiran -ise (organise, realise) paling umum di UK. -ize juga dipakai Oxford, tapi pilih satu dan konsisten.</p></div>
<div class="tip"><b>Tips IELTS</b><p>IELTS menerima ejaan UK maupun US, tapi mencampur keduanya dalam satu tulisan terlihat tidak konsisten.</p></div>`,
qs:[
{t:'mcq',q:'What did you do ___ the weekend?',o:['on','at','in','by'],a:1,e:'British: at the weekend.'},
{t:'mcq',q:'Which pair uses British spelling?',o:['traveled / center','travelled / centre','travelled / center','traveled / centre'],a:1,e:'British: travelled (double l) dan centre (-re).'},
{t:'gap',q:'I need to ___ my speaking every day. (verb, British spelling)',a:['practise'],e:'British: practise (verb), practice (noun).'},
{t:'err',q:['Please','fill','out','this','form','before','the','interview.'],a:2,fix:'in',e:'British: fill in a form.'},
{t:'mcq',q:'This film is very different ___ the book.',o:['than','from','of','with'],a:1,e:'British: different from (atau to).'},
{t:'mcq',q:'Which word is British English?',o:['apartment','elevator','flat','garbage'],a:2,e:'flat = apartment.'}
]},

,{id:'ph', title:'Phonetics & pengucapan British', use:'Speaking: Pronunciation', mins:9,
body:`<p>Pronunciation adalah seperempat nilai Speaking. Untuk band 8.5, kamu tidak harus beraksen British sempurna, tapi bunyi, tekanan kata, dan intonasi harus jelas dan konsisten. Kamus Cambridge menulis pengucapan dengan <b>IPA</b> (International Phonetic Alphabet). Begini cara membacanya:</p>
<div class="ex"><p><span class="ipa">/ˈ/</span> tekanan utama, suku kata setelah tanda ini diucapkan paling keras. <span class="ipa">/ˌ/</span> tekanan kedua.</p><p><span class="ipa">/./</span> titik memisahkan suku kata: comfortable <span class="ipa">/ˈkʌm.fə.tə.bəl/</span></p><p><span class="ipa">/ʳ/</span> r kecil di atas: di British English hanya diucapkan kalau kata berikutnya diawali vokal. healthcare <span class="ipa">/ˈhelθ.keəʳ/</span></p></div>
<p><b>Vokal yang sering tertukar:</b> <span class="ipa">/iː/</span> sheep vs <span class="ipa">/ɪ/</span> ship, <span class="ipa">/æ/</span> cat vs <span class="ipa">/ʌ/</span> cup, <span class="ipa">/ɒ/</span> hot vs <span class="ipa">/ɔː/</span> horse, <span class="ipa">/ɜː/</span> bird, dan <span class="ipa">/ə/</span> (schwa) yang paling sering muncul di bahasa Inggris, contohnya bunyi “a” di <i>about</i>.</p>
<p><b>Konsonan yang sulit untuk penutur Indonesia:</b> <span class="ipa">/θ/</span> think (lidah di antara gigi, bukan “t”), <span class="ipa">/ð/</span> this (bukan “d”), <span class="ipa">/v/</span> very (bukan “f”), <span class="ipa">/z/</span> zoo, <span class="ipa">/ʃ/</span> she (bukan “s”), dan konsonan di akhir kata yang sering tidak diucapkan: <i>worked, asked, months</i>.</p>
<div class="uk"><b>Ciri khas British (Cambridge UK)</b><p>Non-rhotic: “r” setelah vokal tidak diucapkan, car <span class="ipa">/kɑːʳ/</span>. Vokal panjang <span class="ipa">/ɑː/</span> pada bath, can’t, answer. Bunyi <span class="ipa">/ɒ/</span> pada hot, colleague. Diftong <span class="ipa">/əʊ/</span> pada go, hotel. Contoh perbedaan UK dan US: schedule <span class="ipa">/ˈʃedʒ.uːl/</span> vs <span class="ipa">/ˈskedʒ.uːl/</span>.</p></div>
<div class="tip"><b>Tips IELTS</b><p>Akhiran -ed punya tiga bunyi: <span class="ipa">/t/</span> setelah bunyi tak bersuara (watched), <span class="ipa">/d/</span> setelah bunyi bersuara (played), <span class="ipa">/ɪd/</span> setelah t atau d (decided). Weak form juga membuat bicaramu natural: “a gift for you” diucapkan <span class="ipa">/fə/</span>, bukan <span class="ipa">/fɔː/</span>.</p></div>
<div class="mis"><b>Kata yang sering salah ucap</b><p>vegetable <span class="ipa">/ˈvedʒ.tə.bəl/</span> (3 suku kata), Wednesday <span class="ipa">/ˈwenz.deɪ/</span>, island <span class="ipa">/ˈaɪ.lənd/</span> (s tidak dibaca), receipt <span class="ipa">/rɪˈsiːt/</span> (p tidak dibaca), obsolete <span class="ipa">/ˌɒb.səlˈiːt/</span> (tekanan di akhir).</p></div>`,
qs:[
{t:'mcq',q:'Which word begins with the sound /θ/?',o:['this','think','those','then'],a:1,e:'think /θɪŋk/. this, those, then diawali /ð/.'},
{t:'mcq',q:'Where is the main stress in “photography”?',o:['PHO-to-gra-phy','pho-TO-gra-phy','pho-to-GRA-phy','pho-to-gra-PHY'],a:1,e:'/fəˈtɒɡ.rə.fi/. Bandingkan photograph /ˈfəʊ.tə.ɡrɑːf/.'},
{t:'mcq',q:'The -ed in “watched” is pronounced:',o:['/t/','/d/','/ɪd/'],a:0,e:'ch adalah bunyi tak bersuara, jadi -ed dibaca /t/.'},
{t:'mcq',q:'The -ed in “decided” is pronounced:',o:['/t/','/d/','/ɪd/'],a:2,e:'Setelah t atau d, -ed dibaca /ɪd/.'},
{t:'mcq',q:'In British English, the “r” in “car” (said alone) is usually:',o:['pronounced clearly','not pronounced','rolled'],a:1,e:'British English non-rhotic: car /kɑːʳ/.'},
{t:'mcq',q:'Which is the British transcription of “schedule” (Cambridge UK)?',o:['/ˈskedʒ.uːl/','/ˈʃedʒ.uːl/'],a:1,e:'UK /ˈʃedʒ.uːl/, US /ˈskedʒ.uːl/.'},
{t:'mcq',q:'Which word matches /ˈkɒl.iːɡ/?',o:['college','colleague','collect','collage'],a:1,e:'colleague, menurut Cambridge UK.'},
{t:'mcq',q:'In “a gift for you”, “for” is normally pronounced:',o:['/fɔː/','/fə/','/fuː/'],a:1,e:'Kata fungsi biasanya memakai weak form dengan schwa /ə/.'},
{t:'mcq',q:'Which letter is silent in “debt”?',o:['d','e','b','t'],a:2,e:'debt /det/.'},
{t:'mcq',q:'Where is the main stress in “obsolete” (Cambridge UK)?',o:['OB-so-lete','ob-SO-lete','ob-so-LETE'],a:2,e:'Cambridge UK: /ˌɒb.səlˈiːt/, tekanan utama di suku kata terakhir.'}
]}
];

{id:'pft', title:'Past perfect & konsistensi tense', use:'Writing Task 1 & Speaking Part 2', mins:6,
body:`<p><b>Past perfect</b> (had + V3) dipakai untuk kejadian yang terjadi <b>sebelum</b> kejadian atau waktu lain di masa lalu. Di Task 1, pola “by + tahun lampau” hampir selalu memakai past perfect.</p>
<div class="ex"><p>By 2010, sales <u>had doubled</u>. <span>sebelum titik waktu 2010</span></p><p>When I arrived, the lecture <u>had</u> already <u>started</u>. <span>kuliah mulai lebih dulu</span></p><p>I <u>had never travelled</u> alone before that trip. <span>bagus untuk cerita di Part 2</span></p><p>She was exhausted because she <u>had been studying</u> all night. <span>past perfect continuous: durasi</span></p></div>
<div class="tip"><b>Tips IELTS</b><p>Untuk band 7+, examiner melihat apakah tense-mu konsisten. Kalau grafik berisi data lampau, tetap di past simple dan pakai past perfect hanya untuk “by + tahun”.</p></div>
<div class="mis"><b>Kesalahan umum</b><p><s>I had gone to Bali last year.</s> I went to Bali last year. Kalau hanya ada satu kejadian lampau, cukup past simple.</p></div>`,

{id:'fut', title:'Future forms & prediksi', use:'Task 1 projections & Speaking', mins:6,
body:`<div class="ex"><p><u>will</u>: prediksi, opini, keputusan spontan. I think prices will rise.</p><p><u>be going to</u>: rencana, atau prediksi dengan bukti. Look at those clouds. It’s going to rain.</p><p><u>Present continuous</u>: janji atau jadwal pasti. I’m meeting my tutor at four.</p><p><u>Proyeksi Task 1</u>: The population <u>is projected / expected / predicted to</u> double. Sales <u>are set to</u> rise. It <u>is likely to</u> fall.</p><p><u>Future perfect</u>: By 2040, the figure <u>will have reached</u> 10 million.</p></div>
<div class="uk"><b>Catatan British</b><p>“Shall” masih dipakai di British English untuk tawaran atau ajakan dengan I/we: “Shall we start?” “Shall I open the window?”</p></div>
<div class="tip"><b>Tips IELTS</b><p>Untuk pertanyaan Speaking tentang rencana, “I’m hoping to...”, “I’m planning to...”, dan “I’d like to...” terdengar lebih natural daripada “I will...” terus-menerus.</p></div>`,
qs:[
{t:'mcq',q:'The population is projected ___ by 2050.',o:['to double','doubling','double','doubled'],a:0,e:'be projected + to infinitive.'},
{t:'gap',q:'By 2030, the company ___ (open) 50 new shops.',a:['will have opened'],e:'by + waktu masa depan → future perfect.'},
{t:'mcq',q:'Look at those clouds! It ___ rain.',o:['will','is going to','is raining','shall'],a:1,e:'Prediksi dengan bukti yang terlihat → be going to.'},
{t:'mcq',q:'I ___ my tutor at 4 pm tomorrow; it’s in my diary.',o:['will meet','am meeting','meet','would meet'],a:1,e:'Janji yang sudah diatur → present continuous.'},
{t:'err',q:['Sales','are','expected','increasing','next','year.'],a:3,fix:'to increase',e:'be expected + to infinitive.'},
{t:'mcq',q:'Most natural answer to “What are your plans after graduating?”',o:['I will to work abroad.','I’m hoping to work abroad.','I working abroad.','I am go to work abroad.'],a:1,e:'be hoping + to infinitive, natural untuk rencana.'}
]},
{id:'qnt', title:'Quantifiers: few, little, fewer, less', use:'Writing Task 1 & 2', mins:6,
body:`<div class="ex"><p><u>few / a few</u> + countable. <u>little / a little</u> + uncountable.</p><p>Tanpa “a” bermakna negatif (hampir tidak ada): <u>Few</u> people came. Dengan “a” bermakna positif (beberapa): <u>A few</u> people came.</p><p><u>fewer</u> + countable (fewer cars), <u>less</u> + uncountable (less water).</p><p><u>a large number of</u> + countable, <u>a great deal of / a large amount of</u> + uncountable.</p><p><u>Most</u> people (umum) vs <u>most of the</u> people in this room (spesifik). <u>Each / every</u> + kata benda tunggal.</p></div>
<div class="uk"><b>Catatan British</b><p>Dalam percakapan sehari-hari di UK, “less” dengan countable sering terdengar (“ten items or less”). Untuk IELTS Writing, tetap pakai “fewer”.</p></div>`,
qs:[
{t:'mcq',q:'___ people attended the meeting, so it was cancelled.',o:['A few','Few','A little','Little'],a:1,e:'Makna negatif (hampir tidak ada) + countable → few.'},
{t:'mcq',q:'There were ___ cars on the road in 2020 than in 2019.',o:['less','fewer','little','much'],a:1,e:'cars countable → fewer.'},
{t:'gap',q:'The government spent a great ___ of money on the project.',a:['deal'],e:'a great deal of + uncountable.'},
{t:'err',q:['Most','of','students','prefer','online','classes.'],a:1,fix:'Most students / Most of the students',e:'“Most of” harus diikuti the/these/my.'},
{t:'mcq',q:'We have ___ time left, so let’s hurry.',o:['a few','few','little','many'],a:2,e:'time uncountable, makna negatif → little.'},
{t:'mcq',q:'Which is correct?',o:['Each students has a laptop.','Each student has a laptop.','Each student have a laptop.','Every students have a laptop.'],a:1,e:'each + kata benda tunggal + kata kerja tunggal.'}
]},
{id:'wf', title:'Word forms: noun, verb, adjective, adverb', use:'Writing & Speaking', mins:7,
body:`<p>Di band 5.5, banyak error berasal dari <b>kelas kata yang salah</b>. Hafalkan keluarga katanya, bukan cuma satu bentuk.</p>
<div class="ex"><p>Akhiran noun: -tion, -ment, -ity, -ness. Verb: -ise, -en, -ify. Adjective: -al, -ive, -ous, -ful, -able. Adverb: -ly.</p><p>Task 1: a <u>significant</u> increase (adj + noun) = increased <u>significantly</u> (verb + adverb).</p><p>develop, development, developed, developing</p><p>succeed, success, successful, successfully</p><p>benefit, beneficial. compete, competition, competitive.</p><p>economy (ekonomi), <u>economic</u> (berkaitan dengan ekonomi), <u>economical</u> (hemat)</p></div>
<div class="tip"><b>Tips IELTS</b><p>Saat menyimpan kata di Vocab, tulis juga bentuk lainnya di kolom contoh, misalnya “benefit (n/v), beneficial (adj)”.</p></div>`,
qs:[
{t:'mcq',q:'There was a ___ rise in prices.',o:['significantly','significant','significance','signify'],a:1,e:'Sebelum noun “rise” → adjective.'},
{t:'mcq',q:'Sales increased ___ in 2019.',o:['dramatic','dramatically','drama','dramatise'],a:1,e:'Menerangkan verb “increased” → adverb.'},
{t:'gap',q:'Education plays an important role in the ___ (develop) of a country.',a:['development'],e:'Setelah “the” dan sebelum “of” → noun.'},
{t:'err',q:['Tourism','brings','many','economical','benefits.'],a:3,fix:'economic',e:'economic = berkaitan dengan ekonomi. economical = hemat.'},
{t:'mcq',q:'Exercise is ___ for mental health.',o:['benefit','beneficial','beneficially','benefited'],a:1,e:'Setelah “is” → adjective.'},
{t:'gap',q:'Many students find it difficult to ___ (success) without a plan. (verb)',a:['succeed'],e:'to + verb: succeed.'}
]},
{id:'punc', title:'Batas kalimat & tanda baca', use:'Writing: Grammatical accuracy', mins:7,
body:`<p>Examiner menilai seberapa banyak kalimatmu yang <b>bebas error</b>. Kalimat pendek yang benar lebih bernilai daripada kalimat panjang yang “bocor”.</p>
<div class="ex"><p><u>Comma splice</u>: <s>Many people drive, this causes pollution.</s> Many people drive. This causes pollution. Atau: Many people drive, which causes pollution.</p><p><u>Fragment</u>: <s>Because it is cheap.</s> Many people take the bus because it is cheap.</p><p><u>Koma setelah klausa pembuka</u>: If prices rise, demand falls. Although it was late, we continued.</p><p><u>Semicolon</u>: Prices rose; however, demand stayed high.</p><p><u>Tanpa koma sebelum “that”</u>: <s>Experts believe, that...</s> Experts believe that...</p></div>`,
qs:[
{t:'err',q:['Many','people','drive','to','work',',','this','causes','pollution.'],a:5,fix:'work. This... / work, which causes...',e:'Dua kalimat utuh tidak boleh disambung koma saja (comma splice).'},
{t:'mcq',q:'Which sentence is correctly punctuated?',o:['Prices rose, however, demand stayed high.','Prices rose; however, demand stayed high.','Prices rose however demand stayed high.','Prices rose however, demand stayed high.'],a:1,e:'Pola: kalimat; however, kalimat.'},
{t:'mcq',q:'Which is a complete sentence?',o:['Because public transport is cheap.','Although many people disagree.','Many people take the bus because it is cheap.','Which is why cities are crowded.'],a:2,e:'Klausa yang diawali because/although butuh klausa utama.'},
{t:'mcq',q:'Where should the comma go? “If the government invests more in schools students will benefit.”',o:['after “If”','after “schools”','after “government”','no comma needed'],a:1,e:'Koma di akhir klausa if yang ada di depan.'},
{t:'err',q:['Experts','believe',',','that','sugar','is','harmful.'],a:2,fix:'(hapus koma)',e:'Tidak ada koma sebelum that-clause.'},
{t:'mcq',q:'Best fix for “The city is crowded it needs more parks.”',o:['The city is crowded, it needs more parks.','The city is crowded, so it needs more parks.','The city is crowded so, it needs more parks.','The city, is crowded it needs more parks.'],a:1,e:'Sambung dengan koma + conjunction (so).'}
]},
{id:'ger', title:'Gerund vs infinitive', use:'Writing & Speaking', mins:7,
body:`<div class="ex"><p><u>verb + -ing</u>: enjoy, avoid, suggest, consider, mind, finish, keep, recommend</p><p><u>verb + to</u>: decide, plan, hope, want, afford, agree, refuse, manage, tend, aim</p><p><u>Preposition + -ing</u>: interested in learning, by using, instead of driving</p><p><u>“to” sebagai preposition</u>: look forward to meeting, be used to living, contribute to reducing</p><p><u>Gerund sebagai subjek</u>: Learning a language takes time.</p><p><u>Makna berubah</u>: stop smoking (berhenti merokok) vs stop to smoke (berhenti untuk merokok).</p></div>
<div class="mis"><b>Kesalahan umum</b><p><s>contribute to reduce</s> contribute to reducing. <s>suggest him to go</s> suggest that he go / suggest going.</p></div>`,
qs:[
{t:'mcq',q:'I’m looking forward to ___ you.',o:['meet','meeting','met','be meeting'],a:1,e:'look forward to + -ing.'},
{t:'mcq',q:'Many people can’t afford ___ a house in London.',o:['buying','to buy','buy','bought'],a:1,e:'afford + to infinitive.'},
{t:'gap',q:'My teacher suggested ___ (read) English news every day.',a:['reading'],e:'suggest + -ing.'},
{t:'err',q:['Public','transport','can','contribute','to','reduce','pollution.'],a:5,fix:'reducing',e:'contribute to + -ing.'},
{t:'mcq',q:'“He stopped ___” means he no longer smokes.',o:['smoking','to smoke'],a:0,e:'stop + -ing = berhenti melakukan.'},
{t:'mcq',q:'Which is correct?',o:['Learn English is useful.','Learning English is useful.','To learning English is useful.','Learned English is useful.'],a:1,e:'Gerund sebagai subjek.'}
]},
{id:'ref', title:'Referencing: this, these, such, the former', use:'Coherence and Cohesion', mins:6,
body:`<p>Referencing menghindari pengulangan dan membuat paragraf mengalir. Ini dinilai di <b>Coherence and Cohesion</b>.</p>
<div class="ex"><p><u>This / these / such + noun</u>: This trend... These changes... Such policies...</p><p><u>Pronoun harus cocok</u>: Governments... <u>they</u>. Children... <u>they</u>.</p><p><u>The former / the latter</u>: yang pertama / yang kedua disebut.</p><p><u>one / ones</u>: I prefer the black ones.</p></div>
<div class="tip"><b>Tips IELTS</b><p>“This” sendirian sering ambigu. Tambahkan noun: “This imbalance”, “This increase”, “This approach”.</p></div>`,
qs:[
{t:'mcq',q:'The price of oil rose sharply. ___ increase affected transport costs.',o:['This','These','Those','It'],a:0,e:'Satu kenaikan (singular) → This increase.'},
{t:'mcq',q:'Many governments have introduced sugar taxes. ___ policies aim to reduce obesity.',o:['This','Such','It','That'],a:1,e:'Such + plural noun merujuk ke jenis kebijakan tadi.'},
{t:'err',q:['Children','need','exercise,','but','he','often','spends','hours','online.'],a:4,fix:'they often spend',e:'Children (jamak) → they.'},
{t:'mcq',q:'Cars and bicycles are both popular. The former is faster, while the ___ is cheaper.',o:['latter','later','last','other'],a:0,e:'the former … the latter.'},
{t:'gap',q:'I don’t like the blue shoes; I prefer the black ___.',a:['ones'],e:'ones menggantikan noun jamak.'},
{t:'mcq',q:'Which is the clearest?',o:['Prices rose and wages fell. This is a problem.','Prices rose and wages fell. This imbalance is a problem.','Prices rose and wages fell. It is a problem these.','Prices rose and wages fell. That are problems.'],a:1,e:'This + noun lebih jelas.'}
]},
{id:'np', title:'Noun phrases & nominalisation', use:'Writing: gaya akademik', mins:7,
body:`<p>Tulisan akademik memadatkan informasi ke dalam <b>noun phrase</b>. Kata kerja atau sifat diubah jadi kata benda.</p>
<div class="ex"><p>Because people use cars more, pollution has increased. → <u>The growing use of cars</u> has led to <u>higher levels of pollution</u>.</p><p>The government decided to raise taxes. → <u>The government’s decision to raise taxes</u> was unpopular.</p><p>Kata kerja penghubung: lead to, result in, contribute to, be responsible for + noun.</p></div>
<div class="tip"><b>Tips IELTS</b><p>Pakai secukupnya, satu atau dua per paragraf. Kejelasan tetap nomor satu.</p></div>`,
qs:[
{t:'mcq',q:'Nominalise: “Prices fell rapidly.” → “There was a ___ in prices.”',o:['rapid fall','rapidly fall','rapid falling','fall rapid'],a:0,e:'adjective + noun.'},
{t:'mcq',q:'Choose the most academic sentence:',o:['Because lots of people move to cities, cities get crowded.','The mass movement of people to cities has resulted in overcrowding.','People move to cities a lot, so crowded.','Cities are crowded because people move a lot to them.'],a:1,e:'Noun phrase + result in.'},
{t:'gap',q:'The ___ (consume) of fast food has risen among teenagers.',a:['consumption'],e:'consume → consumption.'},
{t:'err',q:['Air','pollution','can','lead','to','increase','health','problems.'],a:5,fix:'an increase in',e:'lead to + noun phrase: an increase in health problems.'},
{t:'mcq',q:'Unemployment ___ a rise in crime.',o:['results in','results to','leads','causes to'],a:0,e:'result in + noun.'},
{t:'gap',q:'The ___ (decide) to close the factory surprised workers.',a:['decision'],e:'decide → decision.'}
]},
{id:'par', title:'Parallel structure', use:'Writing band 7+', mins:6,
body:`<p>Unsur dalam daftar atau pasangan harus punya <b>bentuk grammar yang sama</b>.</p>
<div class="ex"><p>Cycling is <u>cheap</u>, <u>healthy</u> and <u>environmentally friendly</u>. <span>semua adjective</span></p><p>The policy aims <u>to reduce</u> costs, <u>improve</u> quality and <u>save</u> time.</p><p>Both / either / not only ... harus diikuti bentuk yang sejajar.</p><p>Task 1: The figure for men was higher than <u>that for</u> women. <span>“that” = the figure</span></p></div>`,
qs:[
{t:'mcq',q:'Cycling is cheap, healthy and ___.',o:['it protects the environment','environmentally friendly','protecting the environment','the environment'],a:1,e:'Daftar adjective.'},
{t:'mcq',q:'The new policy aims to reduce costs, improve quality and ___ time.',o:['saving','to saving','save','saved'],a:2,e:'Sejajar: reduce, improve, save.'},
{t:'err',q:['She','enjoys','reading,','swimming','and','to','cook.'],a:5,fix:'cooking (hapus “to”)',e:'Daftar -ing: reading, swimming, cooking.'},
{t:'mcq',q:'Which comparison is correct?',o:['The salary of doctors is higher than nurses.','The salary of doctors is higher than that of nurses.','The salary of doctors is higher than of nurses.','Doctors salary higher than nurses.'],a:1,e:'Bandingkan gaji dengan gaji: that of nurses.'},
{t:'gap',q:'The scheme is good both for students ___ for teachers.',a:['and'],e:'both ... and.'},
{t:'mcq',q:'Not only ___ cheaper, but it is also faster.',o:['the train is','is the train','the train it is','train is'],a:1,e:'Not only di awal → inversion.'}
]}
];
