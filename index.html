const LX={"pp":{"s":"Okay so basically gini. Kalau kamu nyebut <b>kapan</b> kejadiannya (yesterday, last year, in 2019, two days ago), it’s done, pakai <b>past simple</b> (V2). Tapi kalau gak nyebut kapan, atau efeknya masih kerasa sampai sekarang, pakai <b>present perfect</b> (have/has + V3). “I went to Bali last year” → ada waktunya, so V2. “I’ve been to Bali twice” → cuma cerita pengalaman, timing-nya gak penting. Orang British juga prefer banget present perfect + just/already/yet: “I’ve just eaten.” Make sense kan?","m":"Ada keterangan waktu lampau (ago, yesterday, last, in 2019)? → V2, it’s over. Ada since, for (sampai sekarang), ever, just, already, yet? → have/has + V3, still ongoing.","en":"Use the past simple for finished actions at a stated past time (yesterday, in 2019, two years ago). Use the present perfect (have/has + past participle) for experiences, for past actions with a result now, and with since or for to describe a period up to now. In British English, the present perfect is preferred with just, already and yet: “Have you finished yet?”"},"pft":{"s":"Past perfect itu literally “the past of the past”. Kalau ada dua kejadian lampau, yang terjadi <b>duluan</b> pakai had + V3. “When I arrived, the film had started” → filmnya mulai duluan, kamu telat, which is relatable. Di Task 1, kalau ketemu “by + tahun lampau” (by 2010), langsung pakai had: “By 2010, sales had doubled.” Tapi jangan overuse ya. Kalau cuma satu kejadian, past simple is enough.","m":"HAD = “already happened before that”. Dua kejadian lampau? Yang duluan dapet HAD. Ketemu “by + tahun lampau”? HAD, no question.","en":"Use the past perfect (had + past participle) for an action that happened before another past action or before a past time: “By 2010, sales had doubled.” If there is only one past event, the past simple is enough. Keep your tenses consistent when you describe past data in Task 1."},"fut":{"s":"Plot twist: future itu bukan cuma will. <b>Will</b> = prediksi atau keputusan spontan (“The phone’s ringing, I’ll get it!”). <b>Be going to</b> = udah ada plan, atau ada evidence-nya (“Look at those clouds, it’s going to rain”). <b>Present continuous</b> = arrangement yang udah fix, udah masuk calendar (“I’m meeting my tutor at 4”). Untuk grafik masa depan di Task 1, pakai is expected to, is projected to, is likely to biar kedengeran lebih professional. Ada “by + tahun depan”? Pakai will have + V3.","m":"Spontan = WILL. Udah ada plan = GOING TO. Udah di calendar = -ING. Future data di Task 1 = “is expected/projected TO”.","en":"Use will for predictions and instant decisions, be going to for plans and for predictions based on evidence, and the present continuous for fixed arrangements. For future data in Task 1, use is expected, projected or predicted to + infinitive, or the future perfect with by: “By 2040, the figure will have reached 10 million.” In British English, shall is used for offers and suggestions: “Shall we start?”"},"art":{"s":"Honestly, ini struggle kita semua karena bahasa Indonesia gak punya a/an/the. Rule paling penting: <b>singular countable noun gak boleh berdiri sendiri</b>. Harus ada partner-nya: a, an, the, my, this, dll. <b>A/an</b> = “sebuah”, belum spesifik. <b>The</b> = udah jelas yang mana, cuma ada satu (the internet), atau superlative (the best). <b>No article</b> = lagi ngomongin hal umum: “Pollution is bad.” “Children need love.” Simple, right?","m":"Singular countable noun = must have a partner. General, plural, atau uncountable = boleh sendiri. Unique atau superlative = THE.","en":"A singular countable noun needs a determiner (a, an, the, my, this). Use a or an for something mentioned for the first time or not specific, and the for something specific, unique (the internet) or with superlatives. Use no article with general plural or uncountable nouns: “Pollution is a serious problem.” British English says in hospital and at university without the."},"sva":{"s":"Subjek tunggal = kata kerja tunggal (pakai -s, is, has). The thing is, subjek di IELTS sering panjang banget, so cari <b>main noun</b>-nya dulu. “The number of students HAS increased” → main noun-nya “the number” (tunggal), “students” cuma pelengkap. Terus careful sama uncountable nouns kayak information, advice, research, evidence, news. Mereka gak pernah dapet -s dan selalu singular, no exceptions.","m":"Cari main noun-nya, “of ...” di belakangnya cuma pelengkap. Information, advice, research, news = always singular, never plural.","en":"The verb must agree with the head of the subject, not the nearest noun: “The number of tourists has doubled.” Uncountable nouns such as information, advice, research, evidence and news take a singular verb and have no plural form. In British English, collective nouns such as team or government can take a singular or plural verb."},"qnt":{"s":"<b>Few / a few</b> buat yang countable (people, cars). <b>Little / a little</b> buat yang uncountable (time, money). Bagian yang suka bikin confused: ada “a” = positive vibes (“ada beberapa, cukup lah”). Gak ada “a” = negative vibes (“dikit banget, almost nothing”). <b>Fewer vs less</b> juga konsepnya sama: fewer cars (countable), less water (uncountable).","m":"Ada “a” = positive vibes. Tanpa “a” = almost nothing. Countable? FEW dan FEWER. Uncountable? LITTLE dan LESS.","en":"Use few, a few and fewer with countable nouns, and little, a little and less with uncountable nouns. Without a, few and little are negative (almost none); with a, they are positive (some). In IELTS Writing, use fewer with countable nouns, even though less is common in casual British speech."},"wf":{"s":"Real talk, di band 5.5 banyak banget error karena salah <b>word form</b>. Satu kata punya banyak versi: noun, verb, adjective, adverb. Mau taruh sebelum noun? Pakai adjective (a <b>significant</b> rise). Mau describe verb? Pakai adverb, biasanya -ly (rose <b>significantly</b>). Ada slot “the ... of”? Isi pakai noun (the <b>development</b> of). Basically tinggal lihat posisinya.","m":"Adjective = pasangannya NOUN. Adverb (-ly) = pasangannya VERB. Slot “the ... of” = pasti NOUN.","en":"Many errors come from using the wrong word form. Use an adjective before a noun (a significant rise), an adverb to describe a verb (rose significantly), and a noun after the and before of (the development of). Learn word families together: succeed, success, successful, successfully."},"id":{"s":"Ini error yang muncul karena kita masih mikir in Bahasa terus translate langsung. “Saya setuju” jadi “I am agree”, padahal agree itu udah verb, gak butuh am. “Diskusi tentang” jadi “discuss about”, padahal discuss langsung aja, tanpa about. The solution? Hafalin versi yang benar sampai jadi muscle memory.","m":"Agree, discuss, explain, marry, suggest = verbs yang independent, gak butuh am, about, me, atau with tambahan. Respect their boundaries.","en":"Some errors come from translating directly from Indonesian. Agree is a verb, so say “I agree”, not “I am agree”. Discuss needs no preposition: “discuss this issue”. Say “explain the rules to me”, “do research” and “for three years”. Keep a personal checklist of your errors and review it before the end of the Writing test."},"punc":{"s":"Dua kalimat lengkap <b>gak boleh</b> disambung pakai koma doang. Namanya comma splice, dan examiner notice banget. Pilih salah satu: titik, semicolon, atau conjunction (and, but, so, which). Terus, kalimat yang mulai pakai because atau although tapi gak ada lanjutannya? Itu belum complete sentence. One more thing: pakai koma setelah opener (However, In my opinion, If ...), tapi jangan ada koma sebelum “that”.","m":"Koma itu bukan lem. Mau gabung dua kalimat? Pakai TITIK, SEMICOLON, atau CONJUNCTION. Because/although = harus ada main clause-nya, jangan digantung.","en":"Do not join two complete sentences with only a comma. Use a full stop, a semicolon, or a conjunction such as and, but, so or which. A clause beginning with because or although is not a complete sentence on its own. Use a comma after an introductory word or clause, but not before a that-clause."},"uk":{"s":"Fun fact: IELTS sebenarnya accept ejaan UK maupun US, as long as kamu konsisten. Karena kita team British, pakai colour, centre, travelled, programme, organise. Vocab-nya juga beda: flat (bukan apartment), lift (bukan elevator), queue (bukan line). Plus prepositions khas British: at the weekend, in hospital, fill in a form. Very posh, very British.","m":"British spelling suka “extra letters”: colOUr, travelLed, programME, centRE. Pick one style and stay consistent.","en":"IELTS accepts British or American spelling, but you should be consistent. British spelling includes colour, centre, travelled and programme, and -ise is the most common ending (organise). British vocabulary includes flat, lift, queue and rubbish, and British usage includes at the weekend, in hospital and fill in a form."},"ger":{"s":"Setiap verb punya “pasangan”-nya sendiri. Ada yang pasangannya <b>-ing</b>: enjoy, avoid, suggest, finish, mind. Ada yang pasangannya <b>to + V1</b>: decide, plan, hope, want, afford, refuse. Setelah preposition (in, of, by, about) always -ing. The tricky part: look forward to, be used to, contribute to. “To” di sini preposition, so tetap pakai -ing!","m":"-ING squad: enjoy, avoid, suggest, finish, mind. TO squad (biasanya soal rencana atau keinginan): decide, plan, hope, want, afford. Look forward TO, used TO, contribute TO = tricky, tetap -ING!","en":"Some verbs are followed by -ing (enjoy, avoid, suggest, finish) and others by to + infinitive (decide, plan, hope, afford, refuse). After a preposition, use -ing: interested in learning. Be careful with expressions in which to is a preposition: look forward to meeting, be used to living, contribute to reducing."},"cond":{"s":"Conditional itu basically “kalau ..., maka ...”. <b>Zero</b>: fakta (If you heat ice, it melts). <b>First</b>: realistic, bisa kejadian (If it rains, I’ll stay home). <b>Second</b>: imagine-imagine soal sekarang (If I were rich, I would travel the world). <b>Third</b>: regret soal masa lalu (If I had studied, I would have passed). Golden rule: setelah “if”, jangan pakai will atau would.","m":"Fakta = present + present. Realistic = present + will. Imagine = past + would. Regret = had + would have. Ada WILL/WOULD setelah IF = red flag 🚩","en":"Use the zero conditional for facts, the first for real future possibilities, the second for imaginary present or future situations (If I were...), and the third for imaginary past situations (If I had known...). Mixed conditionals link a past cause to a present result. Do not use will or would in the if-clause. For variety, use unless, provided that or inversion: “Should the government act now...”"},"pass":{"s":"Passive itu fokusnya ke <b>what happened</b>, bukan who did it. Rumusnya be + V3, satu paket. Diagram proses di Task 1? Hampir semuanya passive: “The beans are harvested, then they are dried.” The catch: verb yang gak punya object (happen, rise, arrive, die) <b>gak bisa</b> jadi passive. Jadi bukan “was happened”, cukup “happened”.","m":"BE + V3 = always a pair. Happen, rise, arrive, die = intransitive, gak bisa jadi passive.","en":"Form the passive with be + past participle. Use it when the action matters more than who does it, especially in Task 1 process diagrams: “The beans are harvested and then dried.” Intransitive verbs such as happen, rise and arrive cannot be passive: say “Prices rose”, not “Prices were risen”."},"rel":{"s":"Relative clause itu buat nambahin info tentang orang atau benda. <b>Who</b> buat orang, <b>which</b> buat benda, <b>whose</b> buat kepemilikan, <b>where</b> buat tempat, <b>when</b> buat waktu. Ada dua jenis: kalau info-nya essential buat nentuin yang mana, gak pakai koma. Kalau cuma extra info, diapit koma dan gak boleh pakai “that”.","m":"WHO = orang, WHICH = benda, WHOSE = punya siapa, WHERE = tempat. Ada koma? “THAT” is not allowed.","en":"Use who for people, which for things, whose for possession, where for places and when for times. Defining clauses identify which person or thing you mean and have no commas. Non-defining clauses add extra information, use commas, and cannot use that. Some clauses can be reduced: “Students living on campus...”, “The money spent on defence...”."},"cmp":{"s":"Task 1 itu intinya compare angka, kayak bandingin harga skincare. Adjective pendek tambah -er/-est (higher, the highest). Yang panjang pakai more/the most (more expensive). Jangan double, “more higher” itu salah. Mau show seberapa beda? Slightly (sedikit), considerably/significantly (jauh). <b>Number of</b> buat countable, <b>amount of</b> buat uncountable.","m":"-ER atau MORE, pick one, jangan dua-duanya. Countable = NUMBER. Uncountable = AMOUNT.","en":"Use -er and -est with short adjectives and more and the most with longer ones, but never both (not “more higher”). Show the size of a difference with slightly, considerably or significantly. Use the number of with countable nouns and the amount of with uncountable nouns. In British English, write per cent as two words."},"link":{"s":"Linking words itu yang bikin ide kamu flow. <b>However</b> biasanya di awal kalimat, terus pakai koma. <b>Although / even though</b> diikuti full clause. <b>Despite / in spite of</b> diikuti noun. Jangan pakai although dan but barengan, pick one. And please, jangan setiap kalimat dikasih linker, examiner justru notice dan gak suka.","m":"Despite + NOUN. Although + CLAUSE. However = awal kalimat + koma. Although + but = toxic combo, pilih salah satu.","en":"Use however at the start of a sentence, followed by a comma. Use although or even though before a clause, and despite or in spite of before a noun or an -ing form. Do not use although and but together. Examiners penalise the mechanical overuse of linking words, so use them only when they show a real relationship between ideas."},"ref":{"s":"Biar gak repetitive, pakai referencing: this, these, such, it, they, the former, the latter. Pro tip: jangan pakai “This” sendirian, tambahin noun-nya: “This increase”, “This problem”, biar reader gak bingung “this yang mana?”. Terus double check, pronoun-nya match gak sama yang dirujuk. Children itu plural, so “they”, bukan “he”.","m":"THIS + noun, jangan dibiarkan sendiri. Former = yang pertama, latter = yang terakhir (L for Last).","en":"Use referencing to avoid repetition: this, these, such, it, they, the former and the latter. Add a noun after this to make the reference clear (this increase, this problem). Make sure each pronoun agrees with the noun it refers to: children... they. Accurate referencing improves your Coherence and Cohesion score."},"mod":{"s":"Modal verbs (can, could, may, might, must, should) selalu diikuti V1 <b>tanpa “to”</b>. Period. Untuk Task 2, biar kedengeran academic dan gak terlalu absolut, pakai hedging: may, might, could, tend to, it is likely that. Biar gak terkesan “pokoknya aku benar”. Terus bedain: <b>mustn’t</b> = dilarang, <b>needn’t / don’t have to</b> = gak wajib, chill.","m":"Modal + V1, NO “to”. Mustn’t = strictly no 🚫. Needn’t = not necessary, chill.","en":"Modal verbs are followed by the bare infinitive, never to: “You should apply.” Use hedging (may, might, could, tend to, it could be argued that) to sound academic and to avoid overgeneralising. Note the difference: mustn’t means something is forbidden, while needn’t or don’t have to means it is not necessary."},"np":{"s":"Nominalisation itu ubah verb atau adjective jadi noun, biar tulisan kamu lebih academic dan padat. “Because people use cars more, pollution increases” jadi “The growing use of cars has led to higher pollution.” Instantly naik level, right? Sambungnya pakai lead to, result in, contribute to. Tapi jangan dipaksain, clarity tetap nomor satu.","m":"Verb jadi NOUN: decide → decision, consume → consumption. Sambung pakai LEAD TO atau RESULT IN. Instantly academic.","en":"Nominalisation turns verbs and adjectives into nouns, making writing more concise and academic: “The growing use of cars has led to higher levels of pollution.” Link noun phrases with verbs such as lead to, result in and contribute to. Use it naturally, because clarity matters more than complexity."},"par":{"s":"Parallel structure = kalau bikin list, bentuknya harus sama semua, kayak satu squad dengan dress code yang sama. Gak boleh ada yang beda sendiri. “Reading, swimming and cooking” (semua -ing), bukan “reading, swimming and to cook”. Waktu compare data di Task 1 juga gitu: compare salary dengan salary, bukan salary dengan orang. So, “than that of nurses”.","m":"List = same dress code, gak ada yang beda sendiri. Compare apples to apples.","en":"Items in a list or pair should have the same grammatical form: “reading, swimming and cooking”, “to reduce costs and to save time”. With both...and, either...or and not only...but also, keep both parts parallel. In comparisons, compare like with like: “higher than that of nurses”."},"cx":{"s":"Ini struktur yang bikin kamu naik level ke band 7+, main character energy. <b>Inversion</b>: kalimat diawali Not only, Never, Rarely, Hardly? Urutannya dibalik kayak pertanyaan (Not only does it...). <b>Cleft</b>: buat kasih emphasis (It is the cost that worries people). <b>Participle clause</b>: Having finished..., tapi pastikan subjeknya orang yang sama. Pakai secukupnya, accuracy tetap lebih penting.","m":"Negative word di depan (Never, Rarely, Not only, Hardly) = kalimatnya dibalik kayak pertanyaan.","en":"Advanced structures can widen your grammatical range: inversion after negative adverbials (Not only does it..., Rarely have we seen...), cleft sentences (It is the cost that worries people), participle clauses (Having finished the report, she...) and noun clauses (What concerns me most is...). Accuracy matters more than complexity, so use one or two per paragraph."},"ph":{"s":"IPA itu basically “alphabet buat bunyi”, biar kamu tahu cara baca tanpa nebak. Tanda ˈ = suku kata yang paling ditekan. Bunyi yang sering ketuker buat kita: th (/θ/ think, /ð/ this), v vs f, dan sh. Ciri British: “r” di akhir kata gak dibaca (car = /kɑː/), very posh. Akhiran -ed bisa bunyi /t/, /d/, atau /ɪd/, tergantung bunyi sebelumnya.","m":"-ed: setelah t atau d → /ɪd/ (decided). Setelah bunyi tak bersuara p, k, s, sh, ch, f → /t/ (watched). Sisanya → /d/ (played).","en":"The IPA shows exactly how a word is pronounced: ˈ marks the main stress and ˌ marks secondary stress. British English is non-rhotic, so the r in car is not pronounced unless a vowel follows. The -ed ending is pronounced /ɪd/ after t or d, /t/ after other voiceless sounds and /d/ after voiced sounds. Weak forms such as /fə/ for for make your speech sound natural."}};
function lessonTabs(L){
  const X=LX[L.id]; if(!X) return `<div class="read">${L.body}</div>`;
  const v=S.prog.lview||'s';
  const tabs=[['s','Santai ✨ + cara ingat'],['b','Baku'],['en','English']];
  return `<div class="tabs" role="tablist" style="margin-bottom:22px">${tabs.map(([k,n])=>`<button class="tab" role="tab" data-lv="${k}" aria-selected="${k===v}">${n}</button>`).join('')}</div>
  <div class="read lv" data-p="s" ${v==='s'?'':'hidden'}><p>${X.s}</p><div class="memo-box"><b>💡 Cara gampang ingetnya</b><p>${esc(X.m)}</p></div><p style="font-family:var(--sans);font-size:.9rem;color:var(--muted)">Contoh lengkap dan catatan British ada di tab Baku.</p></div>
  <div class="read lv" data-p="b" ${v==='b'?'':'hidden'}>${L.body}</div>
  <div class="read lv" data-p="en" lang="en-GB" ${v==='en'?'':'hidden'}><p>${esc(X.en)}</p><button class="btn sm ghost" data-say="${esc(X.en)}">${SPK} Listen (British voice)</button></div>`;
}
function bindLessonTabs(el){
  el.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ const k=b.dataset.lv; el.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-selected',x===b)); el.querySelectorAll('.lv').forEach(p=>p.hidden=p.dataset.p!==k); if(S.prog.lview!==k){S.prog.lview=k;persist('prog');} });
}

/* ---------- state & storage ---------- */
const S = { vocab:[], prog:{xp:0,streak:0,lastDay:null,today:{d:null,xp:0},done:{},quizBest:0,best:{},answered:0,correct:0} };
let DB=null, UID=null, MODE='local';
const LS_V='mtg_vocab', LS_P='mtg_prog';
function loadLocal(){ try{const v=localStorage.getItem(LS_V);if(v)S.vocab=JSON.parse(v);}catch(e){} try{const p=localStorage.getItem(LS_P);if(p)S.prog=Object.assign(S.prog,JSON.parse(p));}catch(e){} }
function saveLocal(){ try{localStorage.setItem(LS_V,JSON.stringify(S.vocab));localStorage.setItem(LS_P,JSON.stringify(S.prog));}catch(e){} }
const timers={}, chains={vocab:Promise.resolve(),prog:Promise.resolve()};
function persist(kind){
  saveLocal();
  if(MODE!=='cloud')return;
  clearTimeout(timers[kind]);
  timers[kind]=setTimeout(()=>{
    const body = kind==='vocab'?{items:JSON.parse(JSON.stringify(S.vocab))}:JSON.parse(JSON.stringify(S.prog));
    chains[kind]=chains[kind].then(()=>DB.doc(`data/users/${UID}/${kind}`).set(body)).catch(err=>{ console.warn(err); setSync(); });
  },700);
}
function setSync(){ const n=$('#syncNote'); if(!n)return; n.innerHTML = MODE==='cloud' ? '<span class="dot on"></span>Tersimpan di akunmu' : '<span class="dot"></span>Tersimpan di browser ini'; }
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use){setSync();return;}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync();return;}
    const id=await user.id(); if(!id){setSync();return;}
    DB=db; UID=id;
    const [v,p]=await Promise.all([DB.doc(`data/users/${UID}/vocab`).get(),DB.doc(`data/users/${UID}/prog`).get()]);
    MODE='cloud';
    if(v.exists){ const items=JSON.parse(JSON.stringify(v.data().items||[])); const seen=new Set(items.map(i=>i.id)); S.vocab.forEach(i=>{if(!seen.has(i.id))items.push(i);}); const added=items.length>(v.data().items||[]).length; S.vocab=items; if(added)persist('vocab'); }
    else if(S.vocab.length) persist('vocab');
    if(p.exists){ const cp=JSON.parse(JSON.stringify(p.data())); if((cp.xp||0)>=(S.prog.xp||0)) S.prog=Object.assign(S.prog,cp); else persist('prog'); }
    else if(S.prog.xp) persist('prog');
    saveLocal(); setSync(); backfill();
    if(['home','vocab'].includes(route.v) && !busy) render();
  }catch(e){ console.warn(e); MODE='local'; setSync(); }
}

/* ---------- progress ---------- */
function touchDay(){ const p=S.prog,t=dayStr(); if(p.lastDay!==t){ p.streak = p.lastDay===dayStr(-1)?(p.streak||0)+1:1; p.lastDay=t; } if(!p.today||p.today.d!==t)p.today={d:t,xp:0}; }
function streakNow(){ const p=S.prog; return (p.lastDay===dayStr()||p.lastDay===dayStr(-1))?(p.streak||0):0; }
function todayXP(){ return S.prog.today&&S.prog.today.d===dayStr()?S.prog.today.xp:0; }
const GOAL=100; const TARGET=8.5; const ME='Salsabila';
function award(x){ if(x<=0)return; touchDay(); S.prog.xp+=x; S.prog.today.xp+=x; persist('prog'); const pl=$('#xpPill'); pl.textContent='+'+x+' XP'; pl.classList.add('show'); clearTimeout(award._t); award._t=setTimeout(()=>pl.classList.remove('show'),1100); }
function level(){ return Math.floor(Math.sqrt((S.prog.xp||0)/50))+1; }

/* ---------- vocab SRS ---------- */
const INT=[0,1,3,7,16,35];
function dueItems(){ const n=Date.now(); return S.vocab.filter(i=>(i.due||0)<=n); }
function addWord(w,m,ex,tag,ipa){ w=w.trim(); if(!w)return false; if(S.vocab.some(i=>norm(i.w)===norm(w)))return false; S.vocab.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,m:(m||'').trim(),ex:(ex||'').trim(),tag:(tag||'').trim(),ipa:(ipa||'').trim(),box:0,due:Date.now(),added:Date.now()}); return true; }
function rateWord(it,r){ const n=Date.now(); if(r===1){it.box=0;it.due=n+10*60000;} else if(r===2){it.box=Math.max(it.box,1);it.due=n+Math.max(1,Math.round(INT[it.box]/2))*DAY;} else if(r===3){it.box=Math.min(5,it.box+1);it.due=n+INT[it.box]*DAY;} else {it.box=Math.min(5,it.box+2);it.due=n+INT[it.box]*DAY*1.3;} persist('vocab'); }
function nextLabel(it,r){ if(r===1)return '10 mnt'; let b=it.box; if(r===2){b=Math.max(b,1);return Math.max(1,Math.round(INT[b]/2))+' hari';} if(r===3)b=Math.min(5,b+1); else b=Math.min(5,b+2); const d=Math.round(INT[b]*(r===4?1.3:1)); return d+' hari'; }

function todayWord(){ const t=dayStr(), p=S.prog; if(p.wotd&&p.wotd.d===t){ const f=ALLW.find(x=>x.w===p.wotd.w); if(f) return f; } const saved=new Set(S.vocab.map(v=>norm(v.w))); let pool=ALLW.filter(x=>!saved.has(norm(x.w))); if(!pool.length) pool=ALLW; let h=7; for(const c of t) h=(h*31+c.charCodeAt(0))>>>0; const w=pool[h%pool.length]; p.wotd={d:t,w:w.w}; persist('prog'); return w; }
function acc(){ const n=S.prog.answered||0; return n?Math.round((S.prog.correct||0)/n*100):0; }

/* ---------- question engine ---------- */
function runSet(box,qs,o={}){
  qs = o.shuffle===false?qs:shuffle(qs);
  let i=0,score=0,tick=null; const wrong={};
  const stop=()=>{if(tick){clearInterval(tick);tick=null;}};
  cleanup=stop;
  function show(){
    stop();
    if(i>=qs.length)return finish();
    const q=qs[i];
    box.innerHTML=`<div class="qbox"><div class="qhead"><span>Soal ${i+1} dari ${qs.length}${o.title?', '+esc(o.title):''}</span>${o.time?`<span class="timer" id="tm">${o.time}</span>`:`<span>Skor ${score}</span>`}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>${qhtml(q)}<div class="fb" id="fb"></div><div class="row" style="margin-top:16px;display:none" id="nx"><button class="btn" id="nxb">${i===qs.length-1?'Lihat hasil':'Lanjut'}</button></div></div>`;
    bind(q);
    if(o.time){ let t=o.time; tick=setInterval(()=>{ t--; const tm=$('#tm',box); if(tm){tm.textContent=t;tm.classList.toggle('low',t<=5);} if(t<=0){stop(); answer(q,false,'Waktu habis.');} },1000); }
  }
  function qhtml(q){
    if(q.t==='mcq') return `<p class="qtext">${esc(q.q)}</p><div class="opts">${q.o.map((x,k)=>`<button class="opt" data-k="${k}">${esc(x)}</button>`).join('')}</div>`;
    if(q.t==='gap') return `<p class="qtext">${esc(q.q)}</p><div class="row" style="flex-wrap:nowrap"><input class="gapin" id="gi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ketik jawaban untuk ___" aria-label="Jawaban"><button class="btn" id="gc">Cek</button></div>`;
    return `<p style="color:var(--muted);margin:0 0 12px">Ketuk bagian yang salah.</p><div class="toks">${q.q.map((x,k)=>`<button class="tok" data-k="${k}">${esc(x)}</button>`).join('')}</div>`;
  }
  function bind(q){
    if(q.t==='mcq') box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok');}); if(k!==q.a)b.classList.add('no'); answer(q,k===q.a); });
    else if(q.t==='gap'){ const gi=$('#gi',box),gc=$('#gc',box); setTimeout(()=>gi.focus(),50); const chk=()=>{ if(!gi.value.trim())return; const ok=q.a.some(a=>norm(a)===norm(gi.value)); gi.disabled=true;gc.disabled=true; gi.classList.add(ok?'ok':'no'); answer(q,ok); }; gc.onclick=chk; gi.onkeydown=e=>{if(e.key==='Enter')chk();}; }
    else box.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; box.querySelectorAll('.tok').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok');}); if(k!==q.a)b.classList.add('no'); answer(q,k===q.a); });
  }
  function answer(q,ok,extra){
    stop();

    if(q.t==='gap'&&extra){ const gi=$('#gi',box); gi.disabled=true; $('#gc',box).disabled=true; }
    if(q.t==='err'&&extra){ box.querySelectorAll('.tok').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok');}); }
    S.prog.answered=(S.prog.answered||0)+1;
    if(ok){score++;S.prog.correct=(S.prog.correct||0)+1;award(10);} else if(q.topic){wrong[q.topic]=(wrong[q.topic]||0)+1;}
    persist('prog');
    const ans = q.t==='gap'?`Jawaban: <b style="display:inline">${esc(q.a[0])}</b>. `: q.t==='err'?`Perbaikan: <b style="display:inline">${esc(q.fix)}</b>. `:'';
    const fb=$('#fb',box); fb.className='fb show '+(ok?'ok':'no'); fb.innerHTML=`<b>${ok?pick(['Spot on!','Brilliant.','Lovely, that’s right.','Correct!'],1)[0]:(extra||'Belum tepat.')}</b><p>${ans}${esc(q.e)}</p>${(q.en&&norm(q.en)!==norm(q.e))?`<p class="en-e" lang="en-GB">🇬🇧 ${esc(q.en)}</p>`:''}${(!ok&&q.topic&&LX[q.topic])?`<p class="memo">💡 <b style="display:inline">Cara ingat:</b> ${esc(LX[q.topic].m)}</p>`:''}`;
    const nx=$('#nx',box); nx.style.display='flex'; const nb=$('#nxb',box); nb.focus(); nb.onclick=()=>{i++;show();};
  }
  function finish(){
    stop(); cleanup=null;
    const tot=qs.length, pct=Math.round(score/tot*100);
    const weak=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>LESSONS.find(l=>l.id===t)).filter(Boolean);
    box.innerHTML=`<div class="result"><div class="big">${score}/${tot}</div><p style="font-size:1.1rem;margin:10px 0 4px"><b>${pct>=90?'Band 8.5 material. Excellent!':pct>=70?'Good effort. Untuk 8.5, kejar 90% ke atas.':'Not bad. Ulangi materinya, lalu coba lagi.'}</b></p><p style="color:var(--muted)">+${score*10} XP dari jawaban benar</p>
    ${weak.length?`<div style="margin:18px 0 6px;text-align:left;max-width:460px;margin-inline:auto"><b>Perlu diulang:</b><div class="grid" style="margin-top:8px">${weak.map(l=>`<button class="lrow" data-id="${l.id}" style="grid-template-columns:1fr"><span><h3>${esc(l.title)}</h3><small>Buka materi</small></span></button>`).join('')}</div></div>`:''}
    <div class="row" style="justify-content:center;margin-top:18px">${o.retry?'<button class="btn ghost" id="rt">Coba lagi</button>':''}${o.nextLabel?`<button class="btn" id="nl">${o.nextLabel}</button>`:''}</div></div>`;
    box.querySelectorAll('.lrow').forEach(b=>b.onclick=()=>go('lesson',b.dataset.id));
    if(o.retry)$('#rt',box).onclick=o.retry;
    if(o.nextLabel)$('#nl',box).onclick=o.onNext;
    if(o.onDone)o.onDone(score,tot);
  }
  show();
}

function saveBest(k,v,lower){ const b=S.prog.best||(S.prog.best={}); if(b[k]==null||(lower?v<b[k]:v>b[k])){b[k]=v;persist('prog');return true;} return false; }
function gameOver(box,title,line,again,isBest){ busy=false; cleanup=null; box.innerHTML=`<div class="result"><div class="big">${title}</div><p style="font-size:1.1rem"><b>${line}</b></p>${isBest?'<span class="chip g">Rekor baru!</span>':''}<div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="ag">Main lagi</button></div></div>`; $('#ag',box).onclick=again; }

 },
 build(box){

    const target=rounds[r], toks=target.split(' ').map((w,k)=>({w,k})); let pool=shuffle(toks); while(pool.length>2&&pool.every((t,k)=>t.k===k))pool=shuffle(toks); let built=[];

      box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{built.push(pool.splice(+b.dataset.p,1)[0]);draw();});

 hunt(box){

 ipa(box){

  <div class="phases">${PHASES.map(p=>`<div class="phase ${curWeek>=p.w[0]&&curWeek<=p.w[1]?'on':''}"><b>${p.name}</b><small>Minggu ${p.w[0]}–${p.w[1]}</small><p>${p.goal}</p></div>`).join('')}</div>
  <h2 style="margin:30px 0 12px">Semua minggu</h2>
  <div class="weeks">${WEEKS.map(w=>weekRow(w,curWeek)).join('')}<details class="wk ${curWeek===13?'on':''}" ${curWeek===13?'open':''}><summary><span class="n">13</span><span><b>Istirahat & hari H</b><small>4 Jan – 7 Jan</small></span></summary><div class="wkb"><p>4 Jan: mini kuis ringan + ulang topik terlemah. 5 Jan: baca catatan kesalahan umum. 6 Jan: istirahat dan persiapan. 7 Jan: ujian.</p></div></details></div>`;
  bindTasks(el,t);
};
function taskRow(x,i,on){ return `<div class="task ${on?'done':''}"><label><input type="checkbox" data-i="${i}" ${on?'checked':''}><span><b>${esc(x.t)}${x.min?` <small>${x.min} mnt</small>`:''}</b><span>${esc(x.x)}</span></span></label>${x.go?`<button class="btn sm ghost" data-go2="${esc(x.go)}">Buka</button>`:''}</div>`; }
function bindTasks(el,d){
  el.querySelectorAll('.task input').forEach(c=>c.onchange=()=>{ const p=S.prog.plan||(S.prog.plan={}); const arr=(p[d]||[]).slice(); arr[+c.dataset.i]=c.checked?1:0; p[d]=arr; c.closest('.task').classList.toggle('done',c.checked); if(c.checked){ award(5); if(arr.filter(Boolean).length===tasksFor(d).length) toast('Semua tugas hari ini selesai. Brilliant!'); } persist('prog'); });
  el.querySelectorAll('[data-go2]').forEach(b=>b.onclick=()=>goTask(b.dataset.go2));
}
function weekRow(w,cur){
  const from=addDays(START,(w.n-1)*7), to=addDays(from,6); let tot=0,dn=0;
  for(let k=0;k<7;k++){const d=addDays(from,k); tot+=tasksFor(d).length; dn+=planDone(d).filter(Boolean).length;}
  const pct=tot?Math.round(dn/tot*100):0;
  const dayName=['Senin','Selasa','Rabu','Kamis','Jumat'];
  const lab=x=>x==='rev'?'Ulangi topik terlemah + mini kuis':x==='quiz'?'Mini kuis 2×':x==='hunt'?'Pemburu error + Error khas Indonesia':x==='mock'?'Tes grammar besar (30 soal)':x.startsWith('app:')?'Paragraf Writing: '+x.slice(4).split(',').map(LT).join(' + '):x.startsWith('acc:')?'Akurasi: '+LT(x.slice(4)):LT(x);
  return `<details class="wk ${w.n===cur?'on':''}" ${w.n===cur?'open':''}><summary><span class="n">${w.n}</span><span><b>${esc(w.f)}</b><small>${fmtS(from)} – ${fmtS(to)}</small></span><span class="chip ${pct>=80?'g':''}">${pct}%</span></summary>
   <div class="wkb">${w.d.map((x,i)=>`<p><b>${dayName[i]}:</b> ${esc(lab(x))}</p>`).join('')}<p><b>Sabtu:</b> Tes mingguan${w.test===1?' (semua topik fase 1)':w.test===2?' (semua topik fase 2)':w.test!=null?' (campuran semua topik)':''} <button class="btn sm ghost" data-wt="${w.n}" style="margin-left:6px;padding:3px 10px">Kerjakan</button></p><p><b>Minggu:</b> Istirahat aktif, flashcard + 1 game.</p></div></details>`;
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-wt]'); if(b){ go('plan','wtest:'+b.dataset.wt); } });

/* ---------- AI sentence check ---------- */
let SAMPLE; async function getSample(){ if(SAMPLE===undefined){ try{ SAMPLE=(window.claude&&window.claude.use)?await window.claude.use('sample'):null; }catch(e){ SAMPLE=null; } } return SAMPLE; }
function mdLite(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-•]\s+/gm,'• ').replace(/\n/g,'<br>'); }
function aiBox(L){
  return `<div class="panel" style="margin-top:16px" id="aib"><h2>Pakai di kalimatmu</h2><p class="lede" style="margin-bottom:12px">Tulis 3 kalimat (atau satu paragraf) tentang topik IELTS memakai struktur “${esc(L.title)}”.</p><textarea class="gapin" id="ait" rows="5" style="resize:vertical;font-size:1rem" placeholder="Tulis kalimatmu di sini…"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="aigo" style="display:none">Cek dengan AI</button><span id="aist" style="color:var(--muted);font-size:.9rem">Memeriksa fitur AI…</span></div><div id="aiout" class="aiout"></div></div>`;
}
async function bindAi(el,L){
  const go_=$('#aigo',el), st=$('#aist',el), out=$('#aiout',el), ta=$('#ait',el);
  const s=await getSample(); if(!document.body.contains(go_))return;
  if(!s){ st.textContent='Cek mandiri: bandingkan kalimatmu dengan contoh dan catatan di materi ini. Pengecekan AI tersedia saat website dibuka lewat link Claude.'; return; }
  go_.style.display=''; st.textContent='Dikoreksi dengan gaya British English.';
  let ctl=null;
  go_.onclick=async()=>{ const txt=ta.value.trim(); if(txt.length<10){toast('Tulis minimal satu kalimat dulu.');return;}
    if(ctl)ctl.abort(); ctl=new AbortController(); go_.disabled=true; out.innerHTML='<p style="color:var(--muted)">Memeriksa…</p>';
    const prompt=`You are a friendly, precise IELTS grammar tutor. Use British English and Cambridge Dictionary conventions. The student is Indonesian, currently around IELTS band 5.5, aiming for band 7+. Today's grammar topic: "${L.title}".
Check the student's text below. Reply in Indonesian (keep English examples in English), plain text, under 220 words:
1. For each sentence: "✓ Benar" or "✗ Perlu perbaikan", then the corrected sentence in British English and a one-line reason.
2. Say whether the target structure ("${L.title}") was used correctly.
3. End with one short tip to sound more like band 7.
Do not invent errors; if a sentence is correct, say so.

Student text:
"""${txt.slice(0,1500)}"""`;
    try{ const r=await s(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{out.innerHTML=mdLite(text);}}); out.innerHTML=mdLite(r.text); award(5); }
    catch(e){ if(e&&e.code==='not_granted'){ out.innerHTML=''; go_.style.display='none'; st.textContent='Pengecekan AI tidak diizinkan di tampilan ini. Kamu tetap bisa cek mandiri dengan contoh di materi.'; } else if(e&&e.code==='rate_limited'){ out.innerHTML='<p>Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.</p>'; } else if(!(e&&e.name==='AbortError')) { out.innerHTML='<p>Pengecekan gagal. Coba lagi sebentar lagi.</p>'; } }
    finally{ go_.disabled=false; } };
}

V.practice = el=>{ const a=document.createElement('div'), b=document.createElement('div'); b.style.marginTop='44px'; el.append(a,b); V.quiz(a); V.games(b); };

/* ---------- boot ---------- */
loadLocal(); backfill(); setSync(); render(); initCloud().then(()=>backfill());
</script>
